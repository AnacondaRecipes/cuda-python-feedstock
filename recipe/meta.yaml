{% set number = 0 %}
{% set version = "13.4.3" %}
{% set sha256 = "a5d776ed2d81ebf43b1b5d8c00d0e75644779e84c1d13b551cf1af98a049a73a" %}

{% set bindings_major_version = version.split(".")[0]|int %}
{% set bindings_minor_version = version.split(".")[1]|int %}
{% set bindings_patch_version = version.split(".")[2]|int %}
{% set target_name = "x86_64-linux" %}  # [linux]
{% set target_name = "sbsa-linux" %}  # [linux and aarch64]
{% set target_name = "x64" %}  # [win and x86_64]
{% set target_name = "arm64" %}  # [win and arm64]
{% set subdir = "" %}
{% set subdir = os.sep.join(["", "targets", target_name]) %}  # [linux or aarch64]
{% set subdir = os.sep.join(["", "Library"]) %}               # [win]

package:
  name: cuda-python-split
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/cuda-python/releases/download/v{{ version }}/cuda-python-v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: {{ number }}
  skip: true  # [py<310 or osx]

# Have certain top-level requirements so conda-smithy can render the correct variants
requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python

outputs:

  - name: cuda-python
    version: {{ version }}
    script: build_output.sh  # [linux]
    script: build_output.bat  # [win]
    build:
      number: {{ number }}
      script_env:
        - SUBDIR={{ subdir }}
        - TARGET_NAME={{ target_name }}
      # FIXME: temporarily skip for win-arm64, because cuda-core depends on cuda-bindings
      skip: true  # [win and arm64]
    requirements:
      host:
        - python
        - pip
        - setuptools >=80.0.0
        - setuptools-scm >=8
      run:
        - python
        - {{ pin_subpackage('cuda-bindings', max_pin='x.x') }}
        # setup.py: "cuda-core~=1.2.0" => "cuda-core >=1.2.0,<1.3.0a0"
        - cuda-core >=1.2.0,<1.3.0a0
        # setup.py: "cuda-pathfinder~=1.1" => "uda-pathfinder >=1.1,<2.0a0"
        - cuda-pathfinder >=1.1,<2.0a0
        - cuda-version >=13.0,<14.0a0
    test:
      requires:
        - pip
        - numpy
      imports:
        - cuda.bindings
        - cuda.bindings.cudla  # [(linux and aarch64) or (win and arm64)]
        - cuda.bindings.cufile  # [linux]
        - cuda.bindings.driver
        - cuda.bindings.nvfatbin
        - cuda.bindings.nvjitlink
        - cuda.bindings.nvml
        - cuda.bindings.nvrtc
        - cuda.bindings.nvvm
        - cuda.bindings.runtime
      commands:
        - pip check
        - python -c "import importlib.metadata; importlib.metadata.version('cuda-python')"
    about:
      home: https://nvidia.github.io/cuda-python/
      license: LicenseRef-NVIDIA-SOFTWARE-LICENSE
      license_file: cuda_python/LICENSE
      license_url: https://github.com/NVIDIA/cuda-python/blob/main/LICENSE.md
      license_family: Other
      summary: CUDA Python
      description: |
        CUDA Python is the home for accessing NVIDIA’s CUDA platform from Python.
      doc_url: https://nvidia.github.io/cuda-python/
      dev_url: https://github.com/NVIDIA/cuda-python

  - name: cuda-bindings
    version: {{ version }}
    script: build_output.sh  # [linux]
    script: build_output.bat  # [win]
    build:
      number: {{ number }}
      script_env:
      script_env:
        - SUBDIR={{ subdir }}
        - TARGET_NAME={{ target_name }}
      ignore_run_exports_from:
        # The run-exports from these dev packages are too tight, so we ignore them.
        # The cuda-python package supports CUDA Enhanced Compatibility through its
        # use of dlopen, so it is compatible with other CUDA minor versions.
        - cuda-nvvm-impl
        - cuda-cudart-dev
        - cuda-cudart-static
        - cuda-nvrtc-dev
        - libcufile-dev  # [linux]
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
      host:
        # cuda.bindings needs to be built with the matching major.minor headers
        - cuda-version =={{ bindings_major_version }}.{{ bindings_minor_version }}
        - cuda-crt-dev_{{ target_platform }}
        - cuda-cudart-dev
        - cuda-cudart-static
        - cuda-cudart
        - cuda-nvvm-impl
        - cuda-nvrtc
        - cuda-nvrtc-dev
        - cuda-profiler-api
        - cuda-pathfinder >=1.5.5,<2
        - libcufile      # [linux]
        - libcufile-dev  # [linux]
        - cython >=3.2.5,<3.3
        - pip
        - pyclibrary >=0.1.7
        - python
        - setuptools >=80.0.0
        - setuptools-scm >=8
      run:
        - python
        - cuda-pathfinder >=1.5.5,<2
        - {{ pin_compatible('cuda-version', min_pin='x', max_pin='x') }}
        # cuda-python requires cuda-nvrtc from the same major version. We ignored
        # run-exports of cuda-nvrtc-dev and instead allow a looser pinning here.
        # Same for cuda-nvvm-impl.
        - {{ pin_compatible('cuda-nvrtc', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('cuda-nvvm-impl', min_pin='x', max_pin='x') }}
        - {{ pin_compatible('libcufile', min_pin='x', max_pin='x') }}  # [linux]
        - libnvjitlink >=13.0,<14.0a0
        - libnvfatbin >=13.0,<14.0a0
        - libcudla >=13.0,<14.0a0  # [(linux and aarch64) or (win and arm64)]
      run_constrained:
        # cuda-cudart is not a hard dependency because cuda-python statically links to
        # cudart. This package is optionally dlopen'd for getting the local cudart
        # version with cuda.cudart.getLocalRuntimeVersion(). We ignored run-exports
        # of cuda-cudart-dev and instead allow a looser pinning here.
        - {{ pin_compatible('cuda-cudart', min_pin='x', max_pin='x') }}
        # if cuda-python (meta-package) is present in the environment,
        # it should be version-compatible.
        - {{ pin_subpackage('cuda-python', max_pin='x.x') }}
    test:
      requires:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cuda-nvcc
        - cuda-nvrtc-dev
        - cuda-profiler-api
        - cython
        - pip
        - numpy
        # 'cythonize' command (from 'cython' package) requires 'distutils'
        # Python 3.14 tests fail with error: "ModuleNotFoundError: No module named 'distutils'"
        # See: https://github.com/conda-forge/setuptools-feedstock/issues/399
        - setuptools
      files:
        - test_cimport.pyx
      commands:
        - pip check
        - export C_INCLUDE_PATH="$CONDA_PREFIX/{{ subdir }}/include"  # [linux]
        - set "CL=%CL% /I%CONDA_PREFIX%\{{ subdir }}\include"         # [win]
        - cythonize -i -3 -Xfreethreading_compatible=True *.pyx
        - python -c "import test_cimport; test_cimport.test()"
        - python -c "import cuda.bindings; print(cuda.bindings.__version__)"
      imports:
        - cuda
        - cuda.bindings
        - cuda.bindings.cudla  # [(linux and aarch64) or (win and arm64)]
        - cuda.bindings.cufile  # [linux]
        - cuda.bindings.driver
        - cuda.bindings.nvfatbin
        - cuda.bindings.nvjitlink
        - cuda.bindings.nvml
        - cuda.bindings.nvrtc
        - cuda.bindings.nvvm
        - cuda.bindings.runtime
    about:
      home: https://nvidia.github.io/cuda-python/cuda-bindings
      license: LicenseRef-NVIDIA-SOFTWARE-LICENSE
      license_file: cuda_bindings/LICENSE
      license_url: https://github.com/NVIDIA/cuda-python/blob/main/LICENSE.md
      license_family: Other
      summary: CUDA Python Low-level Bindings
      description: |
        CUDA Python provides a standard set of low-level interfaces,
        providing full coverage of and access to the CUDA host APIs from Python.
      doc_url: https://nvidia.github.io/cuda-python/cuda-bindings
      dev_url: https://github.com/NVIDIA/cuda-python

about:
  home: https://nvidia.github.io/cuda-python/
  license: LicenseRef-NVIDIA-SOFTWARE-LICENSE
  license_file: LICENSE.md
  license_url: https://github.com/NVIDIA/cuda-python/blob/main/LICENSE.md
  license_family: Other
  summary: CUDA Python
  description: |
    CUDA Python is the home for accessing NVIDIA's CUDA platform from Python.
  doc_url: https://nvidia.github.io/cuda-python/
  dev_url: https://github.com/NVIDIA/cuda-python

extra:
  skip-lints:
    - deprecate_license_url
  feedstock-name: cuda-python
  recipe-maintainers:
    - rwgk
    - rparolin
    - cpcloud
    - bdice
    - jakirkham
    - leofang
    - m3vaz
    - mmccarty
    - vyasr
    - vzhurba01
    - kkraus14
    - oleksandr-pavlyk
